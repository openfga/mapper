name: Scorecard supply-chain security

on:
  # Branch-Protection check only runs against the default branch.
  branch_protection_rule:
  # Keeps the Maintained check fresh.
  schedule:
    - cron: '16 11 * * 0'
  push:
    branches: [ "main" ]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # publish_results only works from the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      # Upload results to the code-scanning dashboard.
      security-events: write
      # Publish results and grant the Scorecard badge.
      id-token: write
      # Required while the repository is private.
      contents: read
      actions: read
      # A job-level permissions block resets unlisted scopes to none; grant the
      # reads Scorecard needs for complete Code-Review/Maintained/CI-Tests results.
      issues: read
      pull-requests: read
      checks: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Forced to false on private repositories.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v2.22.3
        with:
          sarif_file: results.sarif
